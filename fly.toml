app = "rootvscode"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "code_data"
  destination = "/data"
  initial_size = "20gb"

[env]
  HOME = "/root"
  USER = "root"
  KVM_MODE = "auto"
